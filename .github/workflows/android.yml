name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch PrismalAGSL source
        run: |
          git clone --depth 1 --branch v1.0.7 https://github.com/styropyr0/PrismalAGSL.git third_party/PrismalAGSL
          sed -i 's/agp = "9.3.1"/agp = "9.4.1"/; s/kotlin = "2.2.21"/kotlin = "2.4.21"/; s/composeBom = "2026.06.01"/composeBom = "2026.09.00"/' third_party/PrismalAGSL/gradle/libs.versions.toml

      - name: Fetch Glasmio source
        run: git clone --depth 1 https://github.com/NEORUAA/Glasmio.git third_party/Glasmio && cd third_party/Glasmio && git checkout 64b2d00746480c2136a77840cdb849c5505f8b6c

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install stable Android packages
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Download Inter variable font
        run: |
          mkdir -p app/src/main/res/font
          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf" -o app/src/main/res/font/inter_variable.ttf

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Graf-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
